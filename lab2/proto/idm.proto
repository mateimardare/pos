syntax = "proto3";
package idm;

service IdentityService {
  rpc Login          (LoginRequest)          returns (TokenMessage);
  rpc ListUsers      (TokenMessage)          returns (ListUsersResponse);
  rpc CreateUser     (CreateUserRequest)     returns (StatusResponse);
  rpc DeactivateUser (DeactivateUserRequest) returns (StatusResponse);
  rpc ActivateUser   (ActivateUserRequest)   returns (StatusResponse);
  rpc ValidateToken  (TokenMessage)          returns (TokenClaims);
  rpc DestroyToken   (TokenMessage)          returns (StatusResponse);
}

message LoginRequest{
  string username = 1;
  string password = 2; 
}
message TokenMessage{
  string token = 1; 
}  
message User{
  string uid = 1;
  string username = 2;
  string role = 3;
  bool is_active = 4; 
}
message ListUsersResponse{
  repeated User users = 1;
}
message CreateUserRequest{
  string token = 1;
  string username = 2;
  string role = 3;
}
message DeactivateUserRequest{
  string token = 1;
  string username = 2;
}
message ActivateUserRequest{
  string username = 1;
  string password = 2;
}
message TokenClaims{
  string sub = 1;
  string role = 2;
}
message StatusResponse{
  bool success = 1;
  string message = 2;
}