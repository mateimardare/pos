syntax = "proto3";
package idm;

service IdentityService {
  rpc Login (LoginRequest) returns (LoginResponse);
  rpc ListUsers (ListUsersRequest) returns (ListUsersResponse);
  rpc CreateUser (CreateUserRequest) returns (UserResponse);
  rpc DeactivateUser (UserIdRequest) returns (UserResponse);
  rpc ActivateUser (UserIdRequest) returns (UserResponse);
}

message LoginRequest { string username = 1; string password = 2; }
message LoginResponse {
  string access_token = 1;
  int64 expires_in_seconds = 2;
  string uid = 3;
  string username = 4;
  string role = 5;
}
message ListUsersRequest {}
message User {
  string uid = 1;
  string username = 2;
  string role = 3;
  bool is_active = 4;
}
message ListUsersResponse { repeated User users = 1; }
message CreateUserRequest {
  string username = 1;
  reserved 2; // parola nu mai este setată de admin/maintainer, ci de utilizator la primul login
  string role = 3;
}
message UserIdRequest { string uid = 1; }
message UserResponse { User user = 1; }
